version: '3.8'

services:
  agentforge-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentforge-platform
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///:memory:}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production-min-32-chars-long}
    restart: unless-stopped
