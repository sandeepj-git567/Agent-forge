version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentforge-db
    environment:
      POSTGRES_DB: agentforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  agentforge-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentforge-platform
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgrespassword@postgres:5432/agentforge}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production-min-32-chars-long}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
