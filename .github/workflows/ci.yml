name: AgentForge AI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Frontend Dashboard
      run: |
        cd frontend
        npm ci || npm install
        npm run build

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit

    - name: Run Dependency Vulnerability Check
      run: |
        python -m pip check

    - name: Run Security Analysis with Bandit
      run: |
        bandit -r agentforge -ll -ii --skip B101 || true

    - name: Lint with Ruff
      run: |
        python -m ruff check agentforge tests || true

    - name: Syntax & Import Verification
      run: |
        python -m compileall agentforge

    - name: Run Pytest Suite
      run: |
        python -m pytest -v

    - name: Build Docker Production Image
      run: |
        docker build -t agentforge-ai:latest .
