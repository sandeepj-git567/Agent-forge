name: AgentForge AI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pip Check
      run: |
        python -m pip check

    - name: Lint with Ruff
      run: |
        python -m ruff check agentforge tests

    - name: Compileall Verification
      run: |
        python -m compileall agentforge

    - name: Run Pytest Suite
      run: |
        python -m pytest -v

    - name: Build Docker Image
      run: |
        docker build -t agentforge-ai:latest .
